  <!-- Tracks clicks on app store links and any other outbound link (GitHub, letsmap.pl, etc.) -->
  <script>
    document.addEventListener('click', function (e) {
      var a = e.target.closest('a[href]');
      if (!a || !window.umami) return;
      var url;
      try { url = new URL(a.href, location.href); } catch (err) { return; }
      if (url.hostname === location.hostname) return;

      if (url.hostname.indexOf('play.google.com') !== -1 || url.hostname.indexOf('apps.apple.com') !== -1) {
        umami.track('app-store-click', {
          store: url.hostname.indexOf('play.google.com') !== -1 ? 'google-play' : 'app-store',
          page: location.hash || '/'
        });
      } else {
        umami.track('outbound-link', { url: a.href, page: location.hash || '/' });
      }
    });
  </script>
  <!-- Tracks search queries, flagging ones with no results, to surface content gaps -->
  <script>
    (function () {
      var searchTimer;
      document.addEventListener('input', function (e) {
        if (!e.target.matches('.search input[type="search"]')) return;
        var query = e.target.value.trim();
        clearTimeout(searchTimer);
        if (!query) return;
        // Wait longer than docsify's own 100ms search debounce so the results panel is settled.
        searchTimer = setTimeout(function () {
          if (!window.umami) return;
          var panel = document.querySelector('.search .results-panel');
          var resultCount = panel ? panel.querySelectorAll('.matching-post').length : 0;
          umami.track('search', {
            query: query,
            hasResults: resultCount > 0,
            resultCount: resultCount,
            page: location.hash || '/'
          });
        }, 800);
      });
    })();
  </script>
